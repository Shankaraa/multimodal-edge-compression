# Proposed only. Do not run calibration until reviewed.
#
# Intent:
# - W4A16 GPTQ on the text decoder projection weights only.
# - BF16 audio encoder, audio projector, token embeddings, LM head, final norms,
#   and realtime adaptive RMS conditioning.
# - FP8 KV cache via compressed-tensors kv_cache_scheme in the artifact.
#
# This recipe is for a Voxtral-aware Transformers + llm-compressor environment.
# The current repo llm-compressor research env cannot load Voxtral because it pins
# Transformers <= 4.57.6.

track_b_w4a16_decoder_fp8kv_stage:
  obcq_modifiers:
    GPTQModifier:
      sequential_targets:
        - language_model.model.layers
      block_size: 128
      dampening_frac: 0.01
      actorder: static
      offload_hessians: true

      # llm-compressor does not treat bare "*" strings as globs. This is the
      # regex equivalent of "language_model.model.layers.*", narrowed to the
      # decoder Linear projections that can actually be quantized.
      targets:
        - re:^language_model\.model\.layers\.\d+\.(self_attn\.(q_proj|k_proj|v_proj|o_proj)|mlp\.(gate_proj|up_proj|down_proj))$

      ignore:
        # HF / Transformers layout protect list.
        - re:^audio_tower(\.|$)
        - re:^multi_modal_projector(\.|$)
        - re:^language_model\.model\.embed_tokens$
        - re:^language_model\.model\.norm$
        - re:^language_model\.lm_head$
        - re:^.*ada_[^.]*($|\.)
        - re:^.*rms_norm[^.]*($|\.)
        - re:^.*layer_?norm[^.]*($|\.)

        # vLLM runtime layout protect list. These names must survive in the saved
        # quantization_config because vLLM rewrites/loads Voxtral modules under
        # language_model, whisper_encoder, and audio_language_adapter.
        - re:^whisper_encoder(\.|$)
        - re:^audio_language_adapter(\.|$)
        - re:^language_model\.model\.layers\.\d+\.ada_rms_norm_t_cond(\.|$)

        # Consolidated/Mistral source-layout protect list, kept so the same intent
        # is reviewable against docs/gptq_investigation.md Appendix-A names.
        - re:^mm_streams_embeddings(\.|$)
        - re:^layers\.\d+\.ada_rms_norm_t_cond(\.|$)
        - re:^layers\.\d+\.(attention_norm|ffn_norm)$
        - re:^norm$

      config_groups:
        w4a16_decoder:
          targets:
            - re:^language_model\.model\.layers\.\d+\.(self_attn\.(q_proj|k_proj|v_proj|o_proj)|mlp\.(gate_proj|up_proj|down_proj))$
          input_activations: null
          output_activations: null
          weights:
            num_bits: 4
            type: int
            symmetric: true
            strategy: group
            group_size: 128

      kv_cache_scheme:
        num_bits: 8
        type: float
        symmetric: true
        strategy: tensor
        dynamic: false
